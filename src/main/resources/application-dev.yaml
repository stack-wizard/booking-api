spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

# Pretend "today" for resource map /periods default fromDate (only when profile is dev or local).
# booking:
#   dev:
#     reference-date: 2026-04-01
#     # Demo sales flow for Platform "Demo Hotel (DH)" 21111111-… (hotel_code DH). Default true.
#     # Seeds a TENTATIVE booking (accepted quote, local holds) — no OPERA call; tester confirms then posts.
#     # dh-sales-flow-seed: false
#     # dh-sales-flow-platform-tenant-id: 21111111-1111-1111-1111-111111111111

loyalty:
  import:
    # TEMPORARY: the dev IAM user (booking-cms-dev-user) may only write the media prefix of booking-cms-media.
    # Move back to the private default (booking-api/loyalty-imports) once the policy allows it. Fine for sample
    # data only; never import a client's real export under a public prefix.
    s3-key-prefix: ${LOYALTY_IMPORT_S3_KEY_PREFIX:public/booking-api/loyalty-imports}
