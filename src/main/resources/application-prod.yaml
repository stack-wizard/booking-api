spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

# AWS forotel-* stacks set SPRING_PROFILES_ACTIVE=prod (see forotel-infrastructure master.yaml).
# DH demo seed still runs when booking.dev.dh-sales-flow-seed is true (default) and opera_hotel DH exists.
# To disable on forotel-prod, set in SSM SPRING_APPLICATION_JSON:
#   "booking": { "dev": { "dh-sales-flow-seed": false } }
